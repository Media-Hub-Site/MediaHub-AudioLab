name: Build and Release MediaHub-AudioLab

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller Spec
        run: pyinstaller AudioLab.spec

      - name: Compress Build to ZIP
        run: |
          Compress-Archive -Path "dist\AudioLab\*" -DestinationPath "MediaHub-AudioLab.zip" -Force

      - name: Generate Release Tag Name
        id: tag_name
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            echo "TAG=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ github.ref }}" -match "refs/tags/") {
            echo "TAG=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $date = Get-Date -Format "yyyyMMdd-HHmm"
            echo "TAG=v$date" >> $env:GITHUB_OUTPUT
          }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: MediaHub-AudioLab ${{ steps.tag_name.outputs.TAG }}
          files: |
            MediaHub-AudioLab.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
